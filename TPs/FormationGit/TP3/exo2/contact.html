    <main>
        <h2 id="contacter">Me contacter</h2>
        <form action="" method="get">
            <fieldset>
                <legend>Vos coordonnées</legend>
                <p>
                    <label for="prenom"><strong>Votre Prénom</strong></label>
                    <input type="text" name="prenom" placeholder="votre prénom" id="prenom" required autofocus>
                </p>
                <p>
                    <label for="nom"><strong>Votre Nom</strong></label>
                    <input type="text" name="nom" placeholder=" votre nom" id="nom" required>
                </p>
                <p>
                    <label for="email"><strong>Adresse-mail</strong></label>
                    <input type="email" name="email" placeholder="votre adresse email" id="email" autofocus required>
                </p>
                <p>
                    <label for="tel"><strong>Mobile</strong></label>
                    <input type="tel" name="tel" placeholder="votre numéro de mobile" id="tel">
                </p>
            </fieldset>
            <fieldset>
                <legend>Message</legend>
                <p>
                <label for="message"></label>
                <textarea name="message" placeholder=" Ecrivez votre message ici" id="message"></textarea>
                </p>
            </fieldset>
            <input type="submit" value="Envoyer" id="Envoyer">
        </form>
        </fieldset>
    </main>
