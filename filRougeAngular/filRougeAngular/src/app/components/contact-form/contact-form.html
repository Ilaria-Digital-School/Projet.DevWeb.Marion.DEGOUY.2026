<!--formulaire de contact-->
        <section class="marques">
            <div class="div-marques">
                <img src="../assets/images/fr.lombardo-geosystems.it-Plan-de-Mauriac-(Cantal).webp" alt="plan de mauriac">
            </div>
            <div class="div-marques">
                <div>
                    <form class="contactForm" action="" method="">
                        <fieldset>
                            <h2>Contactez nous!</h2>
                            <div>
                                <label for="nom">Nom: </label>
                                <input type="text" id="nom" placeholder="Ecrivez votre nom ici" autocomplete="family-name" required>
        
                                <label for="prenom">Prénom: </label>
                                <input type="text" id="prenom" placeholder="Ecrivez votre prénom ici" autocomplete="name" required>
                            </div>
                            <div>
                                <label for="email">Votre e-mail</label>
                                <input type="email" id="email" placeholder="exemple@gmail.com" autocomplete="email" required>
                            </div>
                            <div>
                                <label for="message">Dite nous ce que l'on peut faire pour vous: </label>
                                <textarea rows="10" id="message" placeholder="Ecrivez votre message ici!"></textarea>
                            </div>
                            <div>
                                <button id="btn-contact" type="submit" class="button-cta" aria-label="envoyer un message">Envoyer un message</button>
                            </div>
                        </fieldset>
                    </form>
                </div>
            </div>
        </section>
